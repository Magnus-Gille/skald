[project]
name = "skald"
version = "0.1.0"
description = "Skald — a small e-paper display that any agent can write to over MCP"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3,<3",
    "pillow>=10.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
pi = [
    "RPi.GPIO ; platform_machine == 'aarch64' or platform_machine == 'armv7l'",
    "spidev ; platform_machine == 'aarch64' or platform_machine == 'armv7l'",
    "gpiozero ; platform_machine == 'aarch64' or platform_machine == 'armv7l'",
    "lgpio ; platform_machine == 'aarch64' or platform_machine == 'armv7l'",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
skald = "skald.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skald"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
